name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build  # type-checks, then bundles

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f deploy/edge/compose.yaml config --quiet
      - name: Validate shared Caddy and Study Companion site
        run: |
          cp deploy/study-companion.caddy deploy/edge/sites/
          docker run --rm -v "$PWD/deploy/edge/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/deploy/edge/sites:/etc/caddy/sites:ro" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: study-companion:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name msc -p 8000:8000 \
            -e APP_PASSWORD=ci-password-long-enough -e SECRET_KEY=$(openssl rand -hex 32) \
            study-companion:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/healthz || { docker logs msc; exit 1; }
          # The web UI build is in the image and its public files are served.
          curl -fsS -o /dev/null http://127.0.0.1:8000/manifest.webmanifest
          curl -fsS -o /dev/null http://127.0.0.1:8000/pdfjs/standard_fonts/FoxitSerif.pfb
          # The connector: OAuth discovery, and /mcp asks for a token.
          curl -fsS http://127.0.0.1:8000/.well-known/oauth-authorization-server | grep -q code_challenge_methods_supported
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp)" = 401
          docker exec msc python -c "import app.prompts as p; assert len(p.load_templates()) >= 7"
      - name: Check shared edge routing and app isolation
        run: |
          docker network create edge
          docker tag study-companion:ci ghcr.io/tkint/study-companion:edge-ci
          export IMAGE_TAG=edge-ci
          printf '\nSECRET_KEY=%s\n' "$(openssl rand -hex 32)" >> .env
          # Use HTTP only in this test, without requesting public certificates.
          sed 's/^study.example.ch {/http:\/\/study.example.ch {/' \
            deploy/study-companion.caddy > deploy/edge/sites/study-companion.caddy
          printf 'http://coach.example.ch {\n reverse_proxy coach-poulpy-server:8080\n}\n' \
            > deploy/edge/sites/coach-poulpy.caddy
          # Stand-in for a second, independently managed app on the same network.
          docker run -d --name other-app --network edge --network-alias coach-poulpy-server \
            caddy:2 caddy respond --listen :8080 --body coach-poulpy
          docker compose up -d
          docker compose -f deploy/edge/compose.yaml up -d
          for _ in $(seq 30); do
            if docker compose -f deploy/edge/compose.yaml exec -T caddy \
              wget -qO- --header='Host: study.example.ch' http://127.0.0.1/healthz; then break; fi
            sleep 1
          done
          docker compose -f deploy/edge/compose.yaml exec -T caddy \
            wget -qO- --header='Host: study.example.ch' http://127.0.0.1/healthz
          test "$(docker compose -f deploy/edge/compose.yaml exec -T caddy \
            wget -qO- --header='Host: coach.example.ch' http://127.0.0.1/health)" = coach-poulpy
          docker compose down
          test "$(docker compose -f deploy/edge/compose.yaml exec -T caddy \
            wget -qO- --header='Host: coach.example.ch' http://127.0.0.1/health)" = coach-poulpy
          docker compose up -d
          docker rm -f other-app
          for _ in $(seq 30); do
            if docker compose -f deploy/edge/compose.yaml exec -T caddy \
              wget -qO- --header='Host: study.example.ch' http://127.0.0.1/healthz; then break; fi
            sleep 1
          done
          docker compose -f deploy/edge/compose.yaml exec -T caddy \
            wget -qO- --header='Host: study.example.ch' http://127.0.0.1/healthz
