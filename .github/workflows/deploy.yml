name: Deploy

# Manual: Actions > Deploy > Run workflow. Writes the app's .env from the production environment's
# variables and secrets, uploads the app and shared Caddy files over SSH and deploys them.
# Setup: docs/releasing.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to deploy (latest, or a version such as 0.5.0)"
        default: latest
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Update the VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          SSH_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          SSH_PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT || '22' }}
          HOST_KEY: ${{ vars.DEPLOY_HOST_KEY || secrets.DEPLOY_HOST_KEY }}
          VERSION: ${{ inputs.version }}
          # Written to the app's .env on the server; empty optional values are left out.
          DOMAIN: ${{ vars.DOMAIN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          MOODLE_URL: ${{ vars.MOODLE_URL }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          SYNC_INTERVAL_HOURS: ${{ vars.SYNC_INTERVAL_HOURS }}
          MOODLE_MAX_FILE_MB: ${{ vars.MOODLE_MAX_FILE_MB }}
          MOODLE_RATE_LIMIT: ${{ vars.MOODLE_RATE_LIMIT }}
          SESSION_MAX_AGE: ${{ vars.SESSION_MAX_AGE }}
          COOKIE_SECURE: ${{ vars.COOKIE_SECURE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          OAUTH_REDIRECT_HOSTS: ${{ vars.OAUTH_REDIRECT_HOSTS }}
          OAUTH_ACCESS_TTL: ${{ vars.OAUTH_ACCESS_TTL }}
          OAUTH_REFRESH_TTL: ${{ vars.OAUTH_REFRESH_TTL }}
        run: |
          for name in DEPLOY_SSH_KEY:SSH_KEY DEPLOY_HOST:HOST DEPLOY_USER:SSH_USER \
            DEPLOY_HOST_KEY:HOST_KEY DOMAIN:DOMAIN SECRET_KEY:SECRET_KEY; do
            if [ -z "$(printenv "${name#*:}")" ]; then
              echo "::error::Missing ${name%%:*} in the production environment."; exit 1
            fi
          done
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::Invalid image version."; exit 1
          fi

          umask 077
          {
            echo "DOMAIN=$DOMAIN"
            echo "IMAGE_TAG=$VERSION"
            for name in SECRET_KEY APP_PASSWORD MOODLE_URL MOODLE_TOKEN SYNC_INTERVAL_HOURS \
              MOODLE_MAX_FILE_MB MOODLE_RATE_LIMIT SESSION_MAX_AGE COOKIE_SECURE TIMEZONE \
              OAUTH_REDIRECT_HOSTS OAUTH_ACCESS_TTL OAUTH_REFRESH_TTL; do
              value=$(printenv "$name" || true)
              if [ -n "$value" ]; then echo "$name=$value"; fi
            done
          } > "$RUNNER_TEMP/.env"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/known_hosts"
          remote() {
            ssh -i "$RUNNER_TEMP/key" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" "$SSH_USER@$HOST" "$1"
          }

          tar -C deploy/caddy -czf - compose.yaml bootstrap.json deploy.py | remote 'mkdir -p ~/caddy && tar -xzf - -C ~/caddy'
          tar -czf - docker-compose.yml deploy/study-companion.caddy deploy/backup.sh -C "$RUNNER_TEMP" .env |
            remote 'mkdir -p ~/study-companion && tar -xzf - -C ~/study-companion'
          remote 'python3 ~/caddy/deploy.py ~/study-companion docker-compose.yml deploy/study-companion.caddy'
