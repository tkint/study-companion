name: Deploy

# Manual: Actions > Deploy > Run workflow. Updates the VPS over SSH.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to deploy (latest, or a version such as 0.5.0)"
        default: latest
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Update the VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          SSH_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          SSH_PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || secrets.DEPLOY_DIR || '~/study' }}
          EDGE_DIR: ${{ vars.EDGE_DIR || secrets.EDGE_DIR || '~/edge' }}
          HOST_KEY: ${{ vars.DEPLOY_HOST_KEY || secrets.DEPLOY_HOST_KEY }}
          VERSION: ${{ inputs.version }}
        run: bash deploy/edge/remote-deploy.sh docker-compose.yml deploy/study-companion.caddy
