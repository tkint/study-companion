name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/moodle-study-companion

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/app/__init__.py)
          if [ "$tag" != "$app" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match backend/app/__init__.py version $app"; exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bundle deploy files
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/moodle-study-companion/deploy
          cp docker-compose.yml .env.example dist/moodle-study-companion/
          cp deploy/Caddyfile dist/moodle-study-companion/deploy/
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${version}/" dist/moodle-study-companion/.env.example
          tar -C dist -czf dist/moodle-study-companion-deploy.tar.gz moodle-study-companion
          cp docker-compose.yml dist/
          cp dist/moodle-study-companion/.env.example dist/env.example
          cp docs/server-setup.md dist/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/moodle-study-companion-deploy.tar.gz
            dist/docker-compose.yml
            dist/env.example
            dist/server-setup.md
