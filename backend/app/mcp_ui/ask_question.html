<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, #ffffff);
    --bg-2: var(--color-background-secondary, #f4f4f2);
    --fg: var(--color-text-primary, #1f1f1c);
    --fg-2: var(--color-text-secondary, #6b6b66);
    --line: var(--color-border-primary, rgba(31, 31, 28, 0.15));
    --accent: var(--color-ring-primary, #2563eb);
    --radius: var(--border-radius-md, 10px);
    --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #262624);
      --bg-2: var(--color-background-secondary, #30302e);
      --fg: var(--color-text-primary, #f5f4ef);
      --fg-2: var(--color-text-secondary, #a8a7a0);
      --line: var(--color-border-primary, rgba(245, 244, 239, 0.16));
      --accent: var(--color-ring-primary, #7aa2ff);
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #262624);
    --bg-2: var(--color-background-secondary, #30302e);
    --fg: var(--color-text-primary, #f5f4ef);
    --fg-2: var(--color-text-secondary, #a8a7a0);
    --line: var(--color-border-primary, rgba(245, 244, 239, 0.16));
    --accent: var(--color-ring-primary, #7aa2ff);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { font: 15px/1.45 var(--font); color: var(--fg); }
  .card { padding: 14px; }
  .q { margin: 0 0 12px; font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
  .q code { font: 0.92em ui-monospace, SFMono-Regular, Menlo, monospace;
            background: var(--bg-2); padding: 1px 4px; border-radius: 4px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  button {
    width: 100%; min-height: 44px; display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; text-align: left; font: inherit; color: inherit;
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button:hover:not(:disabled) { background: var(--bg-2); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { cursor: default; opacity: 0.55; }
  button.picked { opacity: 1; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .letter {
    flex: none; width: 24px; height: 24px; display: grid; place-items: center;
    border-radius: 50%; background: var(--bg-2); font-size: 13px; font-weight: 600;
  }
  .picked .letter { background: var(--accent); color: var(--bg); }
  .text { padding-top: 2px; overflow-wrap: anywhere; }
  .status { margin: 10px 2px 0; min-height: 1.2em; font-size: 13px; color: var(--fg-2); }
</style>
</head>
<body>
<div class="card" id="card" hidden>
  <p class="q" id="question"></p>
  <ol id="choices"></ol>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</div>
<script>
(() => {
  "use strict";
  const LETTERS = "ABCDEFGH";
  const card = document.getElementById("card");
  const qEl = document.getElementById("question");
  const list = document.getElementById("choices");
  const statusEl = document.getElementById("status");
  let nextId = 1, shown = false, answered = false;
  const pending = new Map();

  // JSON-RPC over postMessage with the host (MCP Apps, protocol 2026-01-26).
  function post(msg) { window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*"); }
  function request(method, params) {
    const id = nextId++;
    post({ id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function notify(method, params) { post({ method, params }); }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pending.has(msg.id) && !msg.method) {
      const p = pending.get(msg.id);
      pending.delete(msg.id);
      msg.error ? p.reject(msg.error) : p.resolve(msg.result);
      return;
    }
    if (msg.method === "ui/notifications/tool-input") show(msg.params && msg.params.arguments);
    else if (msg.method === "ui/notifications/host-context-changed") applyContext(msg.params);
    else if (msg.method === "ui/resource-teardown" && msg.id !== undefined) post({ id: msg.id, result: {} });
    else if (msg.method === "ping" && msg.id !== undefined) post({ id: msg.id, result: {} });
  });

  function applyContext(ctx) {
    if (!ctx) return;
    if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) {
      if (k.startsWith("--") && typeof v === "string") document.documentElement.style.setProperty(k, v);
    }
    if (ctx.locale) document.documentElement.lang = ctx.locale;
  }

  // **bold** and `code` only; everything else stays plain text, built as DOM nodes.
  function inline(parent, text) {
    const re = /\*\*([^*]+)\*\*|`([^`]+)`/g;
    let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) parent.append(text.slice(last, m.index));
      const el = document.createElement(m[1] !== undefined ? "strong" : "code");
      el.textContent = m[1] !== undefined ? m[1] : m[2];
      parent.append(el);
      last = re.lastIndex;
    }
    if (last < text.length) parent.append(text.slice(last));
  }

  function show(args) {
    if (shown || !args) return;
    const question = String(args.question || "").trim();
    const choices = (Array.isArray(args.choices) ? args.choices : [])
      .map((c) => String(c).trim()).filter(Boolean).slice(0, LETTERS.length);
    if (!question || choices.length < 2) return;
    shown = true;
    inline(qEl, question);
    choices.forEach((choice, i) => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      const letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = LETTERS[i];
      const label = document.createElement("span");
      label.className = "text";
      inline(label, choice);
      btn.append(letter, label);
      btn.addEventListener("click", () => pick(btn, LETTERS[i], choice));
      li.append(btn);
      list.append(li);
    });
    card.hidden = false;
    resize();
  }

  async function pick(btn, letter, choice) {
    if (answered) return;
    answered = true;
    const buttons = list.querySelectorAll("button");
    buttons.forEach((b) => { b.disabled = true; });
    btn.classList.add("picked");
    statusEl.textContent = "Sending…";
    try {
      await request("ui/message", {
        role: "user",
        content: [{ type: "text", text: `${letter}) ${choice}` }],
      });
      statusEl.textContent = `Answered ${letter}.`;
    } catch (err) {
      answered = false;
      buttons.forEach((b) => { b.disabled = false; });
      btn.classList.remove("picked");
      statusEl.textContent = `Could not send it: type ${letter} in the chat instead.`;
    }
    resize();
  }

  function resize() {
    const height = Math.ceil(Math.max(document.documentElement.scrollHeight, document.body.scrollHeight));
    notify("ui/notifications/size-changed", { height });
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(document.body);

  request("ui/initialize", {
    appInfo: { name: "study-companion-question", version: "1" },
    appCapabilities: { availableDisplayModes: ["inline"] },
    protocolVersion: "2026-01-26",
  }).then((result) => {
    applyContext(result && result.hostContext);
    notify("ui/notifications/initialized", {});
  }).catch(() => notify("ui/notifications/initialized", {}));
})();
</script>
</body>
</html>
