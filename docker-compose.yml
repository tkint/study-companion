# Study Companion only. HTTPS comes from the shared Caddy in deploy/caddy/, which reaches the app
# over the external `edge` network. Deployed by the Deploy workflow (docs/server-setup.md).

name: study

services:
  app:
    image: ghcr.io/tkint/study-companion:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - app-data:/data
    # No published ports: the app is only reachable through Caddy.
    expose:
      - "8000"
    networks:
      default:
      edge:
        aliases: [study-companion-app]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  edge:
    external: true

volumes:
  app-data:
