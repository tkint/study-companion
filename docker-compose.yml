# Study Companion only. HTTPS comes from the shared edge project in deploy/edge/.
# Set up the edge first (docs/server-setup.md), then `docker compose up -d`.

services:
  app:
    image: ghcr.io/tkint/study-companion:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - app-data:/data
    # No published ports: the app is only reachable through Caddy.
    expose:
      - "8000"
    networks:
      default:
      edge:
        aliases: [study-companion-app]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  edge:
    external: true
    name: edge

volumes:
  app-data:
